<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Удержатель — рандомные награды</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 20px;
    background: #1e1e2e;
    color: #fff;
  }

  #bar-wrap {
    width: 320px;
    height: 20px;
    border: 2px solid #666;
    border-radius: 10px;
    overflow: hidden;
  }

  #bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #4f8ef7, #9b59f7);
    transition: width 0.05s linear;
  }

  #btn {
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #4f8ef7;
    color: #fff;
    cursor: pointer;
    user-select: none;
    touch-action: none;
  }
  #btn:active { background: #3a6fd0; }
  #btn.cancel { background: #c0392b; }

  #reward-img {
    max-width: 320px;
    height: auto;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.6s ease;
    display: none; /* скрываем, пока не покажем */
  }

  #msg {
    font-size: 22px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #msg.show { opacity: 1; }

  .reset-btn {
    margin-top: 15px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #2ecc71;
    color: white;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>

  <div id="bar-wrap"><div id="bar"></div></div>
  <button id="btn">Удерживай меня</button>

  <img id="reward-img" src="" alt="" />
  <div id="msg"></div>

  <button class="reset-btn" id="resetBtn">Начать заново</button>

<script>
  const bar = document.getElementById('bar');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const rewardImg = document.getElementById('reward-img');
  const resetBtn = document.getElementById('resetBtn');

  const HOLD_TIME = 3000; // 3 секунды

  const rewards = [
    {
      img: "https://avatars.mds.yandex.net/i?id=27e437c5f1d0eceb340561d306e54779_l-9180844-images-thumbs&n=13",
      text: "Кусь!"
    },
    {
      img: "https://i.pinimg.com/736x/9d/a4/77/9da477368815d1b6bc8fc14070f0b468.jpg",
      text: "Ням!"
    },
    {
      img: "https://i.pinimg.com/736x/1d/03/ee/1d03ee5eee976bc6bc749772adb821f9.jpg",
      text: "Хрум!"
    },
    {
      img: "https://images.steamusercontent.com/ugc/2027237398700764224/E8CC5141DA410191651916DFB2B77A36CA8A6258/?imw=512&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false",
      text: "Арбузик!"
    },
    {
      img: "https://avatars.mds.yandex.net/get-yapic/62162/BjHnLP64kst3GyBNvvlKuoyOpYo-1/orig",
      text: "Дай пять!"
    }
  ];

  let progress = 0;
  let raf = null;
  let lastTime = 0;
  let done = false;

  function startHold(e) {
    e.preventDefault();
    if (done) return;

    btn.classList.remove('cancel');
    btn.textContent = 'Держи...';
    lastTime = performance.now();
    raf = requestAnimationFrame(fillStep);
  }

  function fillStep(now) {
    const delta = now - lastTime;
    lastTime = now;

    progress = Math.min(progress + delta / HOLD_TIME * 100, 100);
    bar.style.width = progress + '%';

    if (progress >= 100) {
      finish();
    } else {
      raf = requestAnimationFrame(fillStep);
    }
  }

  function stopHold() {
    if (done) return;
    cancelAnimationFrame(raf);

    if (progress > 0 && progress < 100) {
      btn.classList.add('cancel');
      btn.textContent = 'Отпустил!';
      rewind();
    }
  }

  function rewind() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function step(now) {
      const delta = now - lastTime;
      lastTime = now;
      progress = Math.max(progress - delta / HOLD_TIME * 100, 0);
      bar.style.width = progress + '%';
      if (progress > 0) {
        raf = requestAnimationFrame(step);
      } else {
        btn.classList.remove('cancel');
        btn.textContent = 'Удерживай меня';
      }
    });
  }

  function finish() {
    done = true;
    cancelAnimationFrame(raf);

    const reward = rewards[Math.floor(Math.random() * rewards.length)];

    // Сначала ставим src, потом показываем картинку
    rewardImg.src = reward.img;
    rewardImg.style.display = 'block';

    msg.textContent = reward.text;

    // Сбрасываем состояние анимации: убираем класс, чтобы при добавлении он сработал заново
    msg.classList.remove('show');
    rewardImg.style.opacity = '0';

    // Принудительно просим браузер пересчитать стили (это запускает transition)
    void rewardImg.offsetWidth;
    void msg.offsetWidth;

    // Теперь добавляем класс — анимация сработает
    rewardImg.style.opacity = '1';
    msg.classList.add('show');

    btn.disabled = true;
    btn.textContent = 'Готово';
    resetBtn.style.display = 'block';
  }

  function resetGame() {
    progress = 0;
    bar.style.width = '0%';

    rewardImg.style.display = 'none';
    rewardImg.style.opacity = '0';
    msg.classList.remove('show');
    msg.textContent = '';

    btn.disabled = false;
    btn.textContent = 'Удерживай меня';
    btn.classList.remove('cancel');

    resetBtn.style.display = 'none';
    done = false;
  }

  btn.addEventListener('mousedown', startHold);
  window.addEventListener('mouseup', stopHold);

  btn.addEventListener('touchstart', startHold, { passive: false });
  btn.addEventListener('touchend', stopHold);
  btn.addEventListener('touchcancel', stopHold);

  resetBtn.addEventListener('click', resetGame);
</script>
</body>
</html>
